function check(){let advanced=false;while(stage<missions.length&&missions[stage].test()){stage++;startTick=tick;advanced=true;}if(advanced)notify(stage===missions.length?'¡Excelente! Completaste tu proyecto.':'¡Bien hecho! Continúa con la siguiente misión.');renderMission();}

function dialog(title,initial,callback,confirmOnly=false){const d=$('#dialog');d.hidden=false;d.innerHTML='<form class="dialogbox"><h2></h2><input aria-label="Nombre" autocomplete="off"><div class="actions"><button type="button">Cancelar</button><button class="primary">'+(confirmOnly?'Confirmar':'Guardar')+'</button></div></form>';d.querySelector('h2').textContent=title;const input=d.querySelector('input');input.value=initial;input.hidden=confirmOnly;d.querySelector('button').onclick=()=>d.hidden=true;d.querySelector('form').onsubmit=e=>{e.preventDefault();const val=input.value.trim();if(!confirmOnly&&!val)return;d.hidden=true;callback(val)};if(confirmOnly)d.querySelector('.primary').focus();else{input.focus();input.select()}}
function menu(e,items){e.preventDefault();e.stopPropagation();const m=$('#context');m.innerHTML='';for(let [text,fn,disabled] of items){const b=document.createElement('button');b.textContent=text;b.disabled=!!disabled;b.onclick=()=>{m.hidden=true;fn()};m.append(b)}m.hidden=false;m.style.left=Math.min(e.clientX,innerWidth-215)+'px';m.style.top=Math.max(130,Math.min(e.clientY,innerHeight-m.offsetHeight-65))+'px';m.querySelector('button:not(:disabled)')?.focus()}
function workspaceTop(){return Math.ceil(document.querySelector('#mission').getBoundingClientRect().bottom)+12;}
function fitWindows(){const top=workspaceTop(),bottom=innerHeight-70;document.documentElement.style.setProperty('--workspace-top',top+'px');document.querySelectorAll('.window').forEach(el=>{el.style.maxHeight=Math.max(100,bottom-top)+'px';el.style.height=Math.min(parseFloat(el.style.height)||440,Math.max(100,bottom-top))+'px';el.style.top=Math.max(top,Math.min(parseFloat(el.style.top)||top,bottom-el.offsetHeight))+'px';el.style.left=Math.max(8,Math.min(parseFloat(el.style.left)||8,innerWidth-el.offsetWidth-8))+'px';});}
function openWindow(title,w=660,h=440){const el=document.createElement('section');el.className='window';const top=workspaceTop();el.style.cssText=`width:${Math.min(w,innerWidth-20)}px;height:${Math.max(100,Math.min(h,innerHeight-top-70))}px;left:${Math.max(10,(innerWidth-Math.min(w,innerWidth-20))/2)}px;top:${top}px;z-index:${++winZ}`;el.innerHTML='<div class="titlebar"><strong></strong><button title="Minimizar" aria-label="Minimizar">−</button><button class="close" title="Cerrar" aria-label="Cerrar">×</button></div><div class="content"></div>';el.querySelector('strong').textContent=title;$('#windows').append(el);el.onpointerdown=()=>el.style.zIndex=++winZ;el.querySelector('.close').onclick=()=>el.remove();el.querySelector('button').onclick=()=>el.remove();const bar=el.querySelector('.titlebar');let drag=null;bar.onpointerdown=e=>{if(e.target.closest('button'))return;drag={x:e.clientX-el.offsetLeft,y:e.clientY-el.offsetTop};bar.setPointerCapture(e.pointerId)};bar.onpointermove=e=>{if(drag){el.style.left=Math.max(8,Math.min(innerWidth-el.offsetWidth-8,e.clientX-drag.x))+'px';el.style.top=Math.max(workspaceTop(),Math.min(innerHeight-el.offsetHeight-70,e.clientY-drag.y))+'px'}};bar.onpointerup=bar.onpointercancel=()=>drag=null;return {el,body:el.querySelector('.content')}}

function copy(f,cut=false){clip={id:f.id,cut};notify((cut?'Cortado: ':'Copiado: ')+f.name);refreshFiles()}
function paste(parent){if(!clip)return notify('Selecciona y copia un archivo primero.');const f=clip.art?{name:clip.name,type:'image',art:clip.art,parent:null}:byId(clip.id);if(!f)return; if(f.type==='folder')return notify('En esta práctica copia solamente imágenes y notas.');if(f.parent===parent)return notify('El archivo ya está en esta carpeta.');if(children(parent).some(x=>x.name===f.name))return notify('Ya existe un archivo con ese nombre. No se cuenta otra vez.');const moved=clip.cut;if(moved){checkpoint();f.parent=parent;clip=null}else add(f.name,f.type,parent,{art:f.art,text:f.text,slides:f.slides?JSON.parse(JSON.stringify(f.slides)):undefined});record(moved?'move':'paste',{parent,art:f.art,name:f.name});refreshFiles();notify(moved?'Archivo movido.':'Archivo pegado.')}
function rename(f){dialog('Renombrar archivo',f.name,name=>{if(children(f.parent).some(x=>x.id!==f.id&&x.name===name))return notify('Ese nombre ya existe.');checkpoint();f.name=name;record('rename',{name,parent:f.parent,art:f.art});refreshFiles()})}
function refreshFiles(){document.querySelectorAll('.window[data-folder]').forEach(el=>el._render?.())}
function explorer(initial='root'){let current=initial;record('folder',{id:current});const w=openWindow('Explorador de archivos',700,470);w.el.dataset.folder=current;function draw(){if(current!=='root'&&!byId(current))current='root';w.el.dataset.folder=current;w.body.innerHTML='';const bar=document.createElement('div');bar.className='toolbar';bar.innerHTML='<button>←</button><span class="path"></span><button>Nueva carpeta</button><button>Pegar</button>';bar.querySelector('.path').textContent=path(current);bar.children[0].disabled=current==='root';bar.children[0].onclick=()=>{current=byId(current)?.parent||'root';draw()};bar.children[2].onclick=()=>dialog('Nueva carpeta','',name=>{if(children(current).some(x=>x.name===name))return notify('Ese nombre ya existe.');add(name,'folder',current);record('create',{name,parent:current});if(normalize(name)==='proyecto espacial'&&current!=='docs')notify('La carpeta debe estar dentro de Documentos. Abre Documentos y créala ahí.');draw()});bar.children[3].disabled=!clip;bar.children[3].onclick=()=>paste(current);w.body.append(bar);const list=document.createElement('div');list.className='files';list.style.marginTop='12px';for(const f of children(current)){const b=document.createElement('button');b.className='file'+(selected===f.id?' sel':'')+(clip?.cut&&clip.id===f.id?' cut':'');b.innerHTML=f.type==='folder'?icons.folder:f.type==='image'?assets(f.art).svg:f.type==='slides'?icons.slides:icons.note;const label=document.createElement('span');label.textContent=f.name;b.append(label);b.onclick=()=>{selected=f.id;selectedParent=current;document.querySelectorAll('.file.sel').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};b.ondblclick=()=>{if(f.type==='folder'){current=f.id;selected=null;record('folder',{id:current});draw()}else if(f.type==='image')view(f);else if(f.type==='slides')presentation(f);else note(f)};b.oncontextmenu=e=>{selected=f.id;selectedParent=current;menu(e,[['Abrir',()=>f.type==='folder'?(current=f.id,draw()):f.type==='image'?view(f):f.type==='slides'?presentation(f):note(f)],['Copiar',()=>copy(f),f.type==='folder'],['Cortar',()=>copy(f,true),f.type==='folder'],['Renombrar',()=>rename(f),['docs','pictures','downloads'].includes(f.id)]])};list.append(b)}if(!list.children.length)list.innerHTML='<p class="empty">Esta carpeta está vacía.</p>';w.body.append(list);w.body.oncontextmenu=e=>{if(e.target.closest('.file'))return;menu(e,[['Pegar',()=>paste(current),!clip]])};}w.el._render=draw;draw();return w}
function view(f){const w=openWindow(f.name,440,350);w.body.classList.add('preview');w.body.innerHTML=assets(f.art).svg;record('view',{name:f.name,parent:f.parent,art:f.art})}
function saveImageTo(img,parent,name){
  name=name.trim();if(!name)return notify('Escribe el nombre del archivo.');
  if(!name.toLowerCase().endsWith('.svg'))name+='.svg';
  if(children(parent).some(x=>x.name===name||x.art===img.id)){notify('Esta imagen ya está en esa carpeta.');return false;}
  add(name,'image',parent,{art:img.id});record('download',{art:img.id,site:img.site,parent});refreshFiles();
  notify(parent==='pictures'?'Imagen guardada en Imágenes.':'Imagen guardada. La misión pide Imágenes.');return true;
}
function download(img){
  const overlay=$('#dialog');overlay.hidden=false;
  overlay.innerHTML='<form class="save-dialog" role="dialog" aria-modal="true" aria-label="Guardar imagen como"><div class="save-title">Guardar imagen como…</div><div class="toolbar"><button type="button" class="save-back" aria-label="Subir a carpeta anterior">↑</button><span class="path"></span></div><div class="save-main"><aside><button type="button" class="save-home">Escritorio</button></aside><div class="save-list files" aria-label="Carpetas y archivos"></div></div><div class="save-bottom"><label>Nombre del archivo<input aria-label="Nombre del archivo" class="save-name"></label><p class="hint">Tipo: imagen SVG · Abre las carpetas con doble clic y después pulsa Guardar.</p><div class="actions"><button type="button" class="save-cancel">Cancelar</button><button class="primary">Guardar</button></div></div></form>';
  let folder='root';const name=overlay.querySelector('.save-name');name.value=img.name+'.svg';
  const list=overlay.querySelector('.save-list');
  function draw(){
    overlay.querySelector('.path').textContent=path(folder);
    overlay.querySelector('.save-back').disabled=folder==='root';list.innerHTML='';
    for(const file of children(folder)){
      const entry=document.createElement('button');entry.type='button';entry.className='file';
      entry.innerHTML=file.type==='folder'?icons.folder:file.type==='image'?assets(file.art).svg:icons.note;
      const label=document.createElement('span');label.textContent=file.name;entry.append(label);
      entry.setAttribute('aria-label',file.name+(file.type==='folder'?' · carpeta, doble clic para abrir':''));
      entry.onclick=()=>{list.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));entry.classList.add('sel');};
      function open(){if(file.type==='folder'){folder=file.id;draw();}else{name.value=file.name;}}
      entry.ondblclick=open;entry.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();open();}};
      list.append(entry);
    }
    if(!list.children.length)list.innerHTML='<p class="empty">Esta carpeta está vacía.</p>';
